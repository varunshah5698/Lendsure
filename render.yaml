# Render blueprint — deploys LendSure as one Docker web service
# (FastAPI + SQLite + React static). Just connect the repo in Render.
services:
  - type: web
    name: lendsure
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Demo OTP shown on screen (demo mode). For real production, set to
      # "0" and fill the SMTP/Twilio vars below — codes then go by email/SMS.
      # The dashboard value on an existing service wins over this file.
      - key: LENDSURE_DEMO_OTP
        value: "1"
      # Comma-separated allowed origins (same-origin serving needs none of
      # these, but set your public URL here if you ever split frontend/API).
      - key: LENDSURE_CORS_ORIGINS
        value: ""
      # Real email OTP (optional — leave empty for demo mode):
      - key: LENDSURE_SMTP_USER
        sync: false
      - key: LENDSURE_SMTP_APP_PASSWORD
        sync: false
      # Real SMS OTP via Twilio Verify (required now that demo OTP is off).
      # Values are entered in the Render dashboard, never in git.
      - key: LENDSURE_SMS_PROVIDER
        value: "twilio"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
